
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>深夜食汤 | Soup Can Thin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Serif SC', sans-serif;
            font-weight: 500;
            -webkit-tap-highlight-color: transparent;
        }
        .serif {
            font-family: 'Noto Serif SC', serif;
        }
        /* Custom scrollbar hide */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes whatsappPulse {
            0% { opacity: 0.24; transform: scale(1); }
            70% { opacity: 0; transform: scale(1.55); }
            100% { opacity: 0; transform: scale(1.55); }
        }
        .animate-whatsapp-pulse {
            animation: whatsappPulse 3.8s ease-out infinite;
        }

        [data-admin-shell],
        [data-admin-shell] main,
        [data-admin-shell] section,
        [data-admin-shell] article,
        [data-admin-shell] form {
            min-width: 0;
        }
        html.admin-scroll-lock,
        body.admin-scroll-lock {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body.admin-scroll-lock {
            position: fixed;
            inset: 0;
            width: 100%;
        }
        [data-admin-shell] {
            overscroll-behavior: none;
        }
        [data-admin-page-header] {
            flex: 0 0 auto;
            transform: translateZ(0);
        }
        [data-scroll-stable] {
            scrollbar-gutter: stable;
        }
        [data-admin-shell] button,
        [data-admin-shell] a,
        [data-admin-shell] input,
        [data-admin-shell] select,
        [data-admin-shell] textarea {
            touch-action: manipulation;
        }
        [data-admin-shell] [class*="overflow-auto"],
        [data-admin-shell] [class*="overflow-x-auto"],
        [data-admin-shell] [class*="overflow-y-auto"] {
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 767px) {
            [data-admin-shell] input:not([type="checkbox"]):not([type="radio"]),
            [data-admin-shell] select,
            [data-admin-shell] textarea {
                font-size: 16px;
            }
            [data-admin-shell] table {
                max-width: none;
            }
            [data-admin-shell] [class*="fixed"][class*="inset-0"] {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body class="bg-[#F5F5F5] text-[#2D2D2D]">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
